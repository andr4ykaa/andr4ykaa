name: Generate contribution snake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# No default permissions; each job receives the bare minimum.
permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out our generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned SHA
        with:
          persist-credentials: false

      - name: Run standalone Python generator
        env:
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: |
          python3 scripts/generate_snake.py --user andr4ykaa --output-dir dist

      - name: Transfer generated SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned SHA
        with:
          name: contribution-snake-svg
          path: |
            dist/github-snake.svg
            dist/github-snake-dark.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out output branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned SHA
        with:
          ref: output
          persist-credentials: true

      - name: Download generated SVGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, pinned SHA
        with:
          name: contribution-snake-svg
          path: .

      - name: Validate SVG files and publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = '{http://www.w3.org/2000/svg}'
          allowed = {ns + item for item in ('svg', 'title', 'style', 'rect')}
          for filename in ('github-snake.svg', 'github-snake-dark.svg'):
              data = Path(filename).read_bytes()
              if not 100 < len(data) < 500_000:
                  raise SystemExit(f'Invalid SVG size: {filename}')
              root = ET.fromstring(data)
              if root.tag != ns + 'svg':
                  raise SystemExit(f'Not an SVG: {filename}')
              for element in root.iter():
                  if element.tag not in allowed:
                      raise SystemExit(f'Forbidden SVG element: {element.tag}')
                  if any(k.lower().startswith('on') or 'href' in k.lower() for k in element.attrib):
                      raise SystemExit(f'Forbidden SVG attribute in {filename}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'SVGs unchanged; nothing to publish'
            exit 0
          fi
          git commit -m 'Update contribution snake [skip ci]'
          git push origin HEAD:output
